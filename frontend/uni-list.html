<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudentAbroad - University List</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="website icon" type="png" href="./img/logo_01.png" />
</head>

<body>
  <header class="site-header" id="header-footer-color">
    <div class="container">
      <div class="header__container">
        <div class="logo">
          <a href="index.html">
            <img src="./img/logo.svg" alt="StudentAbroad logo" />
          </a>
        </div>

        <nav class="header__nav">
          <ul class="header__menu">
            <li>
              <a class="link" href="#about-us-section" data-en="ABOUT US" data-ua="ПРО НАС">ABOUT US</a>
            </li>
            <li>
              <a class="link active" href="uni-list.html" data-en="UNI LIST" data-ua="СПИСОК ВНЗ">UNI LIST</a>
            </li>
            <li>
              <a class="link" href="#program-list-section" data-en="PROGRAM LIST" data-ua="ПРОГРАМИ">PROGRAM LIST</a>
            </li>
            <li>
              <a class="link" href="#faq-section" data-en="FAQ" data-ua="ПИТАННЯ">FAQ</a>
            </li>
          </ul>
        </nav>

        <div class="lang-search">
          <span class="language-switch">
            <button data-lang="ua" class="js-switch-button" type="button">UA</button>
            <button data-lang="en" class="js-switch-button active" type="button">EN</button>
          </span>
          <div class="search-box">
            <input type="text" id="searchInput" class="search-box__input" data-en="Search..." data-ua="Шукати..." placeholder="Search..." />
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="country-section">
      <div class="text-effect" data-en="COUNTRY" data-ua="КРАЇНА">COUNTRY</div>

      <div class="checkbox-group" id="countryFilter">
        <label class="container-checkbox">
          <input type="checkbox" value="UA">
          <span class="checkmark"></span>
          <span data-en="Ukraine" data-ua="Україна">Ukraine</span>
        </label>

        <label class="container-checkbox">
          <input type="checkbox" value="ES">
          <span class="checkmark"></span>
          <span data-en="Spain" data-ua="Іспанія">Spain</span>
        </label>

        <label class="container-checkbox">
          <input type="checkbox" value="DE">
          <span class="checkmark"></span>
          <span data-en="Germany" data-ua="Німеччина">Germany</span>
        </label>

        <label class="container-checkbox">
          <input type="checkbox" value="AT">
          <span class="checkmark"></span>
          <span data-en="Austria" data-ua="Австрія">Austria</span>
        </label>

        <label class="container-checkbox">
          <input type="checkbox" value="BE">
          <span class="checkmark"></span>
          <span data-en="Belgium" data-ua="Бельгія">Belgium</span>
        </label>

        <label class="container-checkbox">
          <input type="checkbox" value="NL">
          <span class="checkmark"></span>
          <span data-en="Netherlands" data-ua="Нідерланди">Netherlands</span>
        </label>

        <label class="container-checkbox">
          <input type="checkbox" value="FI">
          <span class="checkmark"></span>
          <span data-en="Finland" data-ua="Фінляндія">Finland</span>
        </label>

        <label class="container-checkbox">
          <input type="checkbox" value="PL">
          <span class="checkmark"></span>
          <span data-en="Poland" data-ua="Польща">Poland</span>
        </label>

        <label class="container-checkbox">
          <input type="checkbox" value="SE">
          <span class="checkmark"></span>
          <span data-en="Sweden" data-ua="Швеція">Sweden</span>
        </label>

        <label class="container-checkbox">
          <input type="checkbox" value="CY">
          <span class="checkmark"></span>
          <span data-en="Cyprus" data-ua="Кіпр">Cyprus</span>
        </label>

        <label class="container-checkbox">
          <input type="checkbox" value="CZ">
          <span class="checkmark"></span>
          <span data-en="Czech Republic" data-ua="Чеська Республіка">Czech Republic</span>
        </label>

        <label class="container-checkbox">
          <input type="checkbox" value="HU">
          <span class="checkmark"></span>
          <span data-en="Hungary" data-ua="Угорщина">Hungary</span>
        </label>
      </div>

      <div class="university-list" id="universityContainer">
        <!-- Universities will be loaded here dynamically -->
        <div class="loading-spinner"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer__container">
        <div class="footer__logo">
          <img class="footer__img" src="./img/name_no-background_01.svg" alt="StudentAbroad logo" />
        </div>

        <div class="footer__bottom-row">
          <nav class="footer__nav">
            <ul class="footer__menu">
              <li>
                <a class="footer__link" href="#about-us-section" data-en="ABOUT US" data-ua="ПРО НАС">ABOUT US</a>
              </li>
              <li>
                <a class="footer__link active" href="uni-list.html" data-en="UNI LIST" data-ua="СПИСОК ВНЗ">UNI LIST</a>
              </li>
              <li>
                <a class="footer__link" href="#program-list-section" data-en="PROGRAM LIST" data-ua="ПРОГРАМИ">PROGRAM LIST</a>
              </li>
              <li>
                <a class="footer__link" href="#faq-section" data-en="FAQ" data-ua="ПИТАННЯ">FAQ</a>
              </li>
            </ul>
          </nav>

          <div class="lang-search">
            <span class="language-switch">
              <button data-lang="ua" class="js-switch-button" type="button">UA</button>
              <button data-lang="en" class="js-switch-button active" type="button">EN</button>
            </span>
            <div class="search-box">
              <input type="text" class="search-box__input" data-en="Search..." data-ua="Шукати..." placeholder="Search..." />
            </div>
          </div>
        </div>
        <div class="footer__line"></div>
      </div>
    </div>
  </footer>

  <script src="./uni-list.js"></script>
</body>
</html>
