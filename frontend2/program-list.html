<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-en="StudentAbroad - Programs" data-ua="StudentAbroad - Програми">StudentAbroad - Програми</title>
    <link rel="stylesheet" href="./project/css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap"
      rel="stylesheet" />
    <link rel="website icon" type="png" href="./img/logo_01.png" />
  </head>

  <body>
    <script src="index.js"></script>
    <header class="site-header" id="header-footer-color">
      <div class="container">
        <div class="header__container">
          <div class="logo">
            <a href="index.html">
              <img src="./project/img/logo.svg" alt="StudentAbroad logo" />
            </a>
          </div>

          <nav class="header__nav">
            <ul class="header__menu">
              <li>
                <a
                  class="link"
                  href="index.html"
                  data-en="ABOUT US"
                  data-ua="ПРО НАС"
                  >ПРО НАС</a
                >
              </li>
              <li>
                <a
                  class="link"
                  href="uni-list.html"
                  data-en="UNI LIST"
                  data-ua="СПИСОК ВНЗ"
                  >СПИСОК ВНЗ</a
                >
              </li>
              <li>
                <a
                  class="link active"
                  href="program-list.html"
                  data-en="PROGRAM LIST"
                  data-ua="ПРОГРАМИ"
                  >ПРОГРАМИ</a
                >
              </li>
              <li>
                <a class="link" href="./faq.html" data-en="FAQ" data-ua="FAQ"
                  >FAQ</a
                >
              </li>
            </ul>
          </nav>

          <div class="lang-search">
            <span class="language-switch">
              <button data-lang="ua" class="js-switch-button active" type="button">
                UA
              </button>
              <button
                data-lang="en"
                class="js-switch-button"
                type="button">
                EN
              </button>
            </span>
            <div class="search-box">
              <input
                type="text"
                id="searchInput"
                class="search-box__input"
                data-en="Search..."
                data-ua="Шукати..."
                placeholder="Шукати..." />
            </div>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="country-section">
        <div class="container">
          <div class="country-section__heading">
            <span
              class="country-section__text-outline"
              data-en="HOME UNIVERSITY"
              data-ua="УНІВЕРСИТЕТ ВІДПРАВЛЕННЯ"
              >УНІВЕРСИТЕТ ВІДПРАВЛЕННЯ
            </span>
            <h2
              class="country-section__text-fill"
              data-en="HOME UNIVERSITY"
              data-ua="УНІВЕРСИТЕТ ВІДПРАВЛЕННЯ">
              УНІВЕРСИТЕТ ВІДПРАВЛЕННЯ
            </h2>
          </div>

          <div class="country-search-box">
            <div class="search-input-wrapper">
              <input
                type="text"
                id="homeUniSearch"
                class="country-search-box__input"
                placeholder="Шукати університети відправлення..."
                data-en="Search home universities..."
                data-ua="Шукати університети відправлення..." />
              <div class="country-search-box__line"></div>
            </div>
          </div>

          <div class="checkbox-group" id="homeUniCheckboxes">
            <!-- Home university checkboxes will be populated here -->
          </div>
          
          <div id="switch-country-button">&lt— — —&gt</div>
          
          <h1 data-en="Level" data-ua="Ступінь" id="level">Ступінь</h1>
          
          <div class="level-checkbox-group">
            <label class="container-checkbox">
              <input type="checkbox" value="bachelor" class="level-filter" />
              <span class="checkmark"></span>
              <span class="country-label" data-en="Bachelor" data-ua="Бакалавр"
                >Бакалавр</span
              >
            </label>

            <label class="container-checkbox">
              <input type="checkbox" value="master" class="level-filter" />
              <span class="checkmark"></span>
              <span class="country-label" data-en="Master" data-ua="Магістр"
                >Магістр</span
              >
            </label>

            <label class="container-checkbox">
              <input type="checkbox" value="phd" class="level-filter" />
              <span class="checkmark"></span>
              <span class="country-label" data-en="PhD" data-ua="Доктор"
                >Доктор</span
              >
            </label>
          </div>

          <section class="program-list" id="programListContainer">
            <!-- Programs will be loaded here dynamically -->
            <div class="loading-spinner">Завантаження програм...</div>
          </section>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="footer__container">
          <div class="footer__logo">
            <img
              class="footer__img"
              src="./project/img/name_no-background_01.svg"
              alt="StudentAbroad logo" />
          </div>

          <div class="footer__bottom-row">
            <nav class="footer__nav">
              <ul class="footer__menu">
                <li>
                  <a
                    class="footer__link"
                    href="index.html"
                    data-en="ABOUT US"
                    data-ua="ПРО НАС"
                    >ПРО НАС</a
                  >
                </li>
                <li>
                  <a
                    class="footer__link"
                    href="uni-list.html"
                    data-en="UNI LIST"
                    data-ua="СПИСОК ВНЗ"
                    >СПИСОК ВНЗ</a
                  >
                </li>
                <li>
                  <a
                    class="footer__link active"
                    href="program-list.html"
                    data-en="PROGRAM LIST"
                    data-ua="ПРОГРАМИ"
                    >ПРОГРАМИ</a
                  >
                </li>
                <li>
                  <a
                    class="footer__link"
                    href="faq.html"
                    data-en="FAQ"
                    data-ua="FAQ"
                    >FAQ</a
                  >
                </li>
              </ul>
            </nav>

            <div class="lang-search">
              <span class="language-switch">
                <button data-lang="ua" class="js-switch-button active" type="button">
                  UA
                </button>
                <button
                  data-lang="en"
                  class="js-switch-button"
                  type="button">
                  EN
                </button>
              </span>
              <div class="search-box">
                <input
                  type="text"
                  class="search-box__input"
                  data-en="Search..."
                  data-ua="Шукати..."
                  placeholder="Шукати..." />
              </div>
            </div>
          </div>
          <div class="footer__line"></div>
        </div>
      </div>
    </footer>

    <script>
      const API_BASE_URL = 'http://127.0.0.1:8000/api';
      let allPrograms = [];
      let allHomeUniversities = [];
      let currentLanguage = localStorage.getItem('language') || 'ua';

      // Translations dictionary
      const translations = {
        en: {
          // Header
          'ПРО НАС': 'ABOUT US',
          'СПИСОК ВНЗ': 'UNI LIST', 
          'ПРОГРАМИ': 'PROGRAM LIST',
          'FAQ': 'FAQ',
          
          // Main section
          'Університет відправлення': 'HOME UNIVERSITY',
          'Шукати...': 'Search...',
          'Шукати університети відправлення...': 'Search home universities...',
          'Ступінь': 'Level',
          'Бакалавр': 'Bachelor',
          'Магістр': 'Master',
          'Доктор': 'PhD',
          
          // Program cards
          'Читати більше': 'Read more',
          'Для цієї програми немає відгуку.': 'No testimonial available for this program.',
          
          // Status messages
          'Завантаження програм...': 'Loading programs...',
          'Не знайдено програм, що відповідають вашим критеріям.': 'No programs found matching your criteria.',
          'Не вдалося завантажити програми. Будь ласка, спробуйте пізніше.': 'Failed to load programs. Please try again later.'
        },
        ua: {
          // Header  
          'ABOUT US': 'ПРО НАС',
          'UNI LIST': 'СПИСОК ВНЗ',
          'PROGRAM LIST': 'ПРОГРАМИ', 
          'FAQ': 'FAQ',
          
          // Main section
          'HOME UNIVERSITY': 'Університет відправлення',
          'Search...': 'Шукати...',
          'Search home universities...': 'Шукати університети відправлення...',
          'Level': 'Ступінь',
          'Bachelor': 'Бакалавр',
          'Master': 'Магістр',
          'PhD': 'Доктор',
          
          // Program cards
          'Read more': 'Читати більше',
          'No testimonial available for this program.': 'Для цієї програми немає відгуку.',
          
          // Status messages
          'Loading programs...': 'Завантаження програм...',
          'No programs found matching your criteria.': 'Не знайдено програм, що відповідають вашим критеріям.',
          'Failed to load programs. Please try again later.': 'Не вдалося завантажити програми. Будь ласка, спробуйте пізніше.'
        }
      };

      // Функція для перекладу тексту
      function translateText(text) {
        return translations[currentLanguage][text] || text;
      }

      // Функція для миттєвої зміни мови
      async function switchLanguage(lang) {
        currentLanguage = lang;
        localStorage.setItem('language', lang);
        
        // Миттєво оновлюємо весь інтерфейс
        updatePageLanguage();
        
        // Перезавантажуємо дані з бекенду з новою мовою
        await loadAllPrograms();
      }

      // Функція для оновлення тексту на сторінці
      function updatePageLanguage() {
        // Оновлення тексту в елементах з data-атрибутами
        document.querySelectorAll('[data-en][data-ua]').forEach(element => {
          const text = element.getAttribute(`data-${currentLanguage}`);
          if (element.placeholder !== undefined) {
            element.placeholder = text;
          } else {
            element.textContent = text;
          }
        });

        // Оновлення заголовка сторінки
        const titleElement = document.querySelector('title');
        if (titleElement) {
          titleElement.textContent = currentLanguage === 'en' 
            ? titleElement.getAttribute('data-en') 
            : titleElement.getAttribute('data-ua');
        }

        // Оновлення активних кнопок мови
        document.querySelectorAll('.js-switch-button').forEach(button => {
          if (button.getAttribute('data-lang') === currentLanguage) {
            button.classList.add('active');
          } else {
            button.classList.remove('active');
          }
        });

        // Оновлення атрибута lang у html
        document.documentElement.lang = currentLanguage === 'en' ? 'en' : 'uk';
      }

      // Функція для завантаження програм з бекенду
      async function loadAllPrograms() {
        const programListContainer = document.getElementById('programListContainer');
        if (!programListContainer) return;

        // Показуємо loading
        programListContainer.innerHTML = `<div class="loading-spinner">${translateText('Loading programs...')}</div>`;
        
        try {
          // Додаємо параметр мови до запиту
          const url = `${API_BASE_URL}/programs/?lang=${currentLanguage === 'en' ? 'en' : 'uk'}`;
          
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          
          const programs = await response.json();
          allPrograms = programs;
          allHomeUniversities = [...new Set(programs.map(p => p.home_university).filter(Boolean))];
          updateHomeUniversityFilters();
          filterPrograms();
          
        } catch (error) {
          console.error('Error fetching programs:', error);
          programListContainer.innerHTML = `<p class="error-message">${translateText('Failed to load programs. Please try again later.')}</p>`;
        }
      }

      function updateHomeUniversityFilters() {
        const searchTerm = document.getElementById('homeUniSearch').value.toLowerCase();
        const checkboxGroup = document.getElementById('homeUniCheckboxes');
        if (!checkboxGroup) return;
        
        checkboxGroup.innerHTML = '';
        
        // Filter home universities based on search term
        const filteredHomeUnis = allHomeUniversities.filter(uni => 
          uni.toLowerCase().includes(searchTerm));
        
        // Create checkboxes for filtered home universities
        filteredHomeUnis.forEach(uni => {
          const label = document.createElement('label');
          label.className = 'container-checkbox';
          
          const input = document.createElement('input');
          input.type = 'checkbox';
          input.className = 'home-uni-filter';
          input.value = uni;
          
          const checkmark = document.createElement('span');
          checkmark.className = 'checkmark';
          
          const countryLabel = document.createElement('span');
          countryLabel.className = 'country-label';
          countryLabel.textContent = uni.length > 20 ? `${uni.substring(0, 20)}...` : uni;
          
          label.appendChild(input);
          label.appendChild(checkmark);
          label.appendChild(countryLabel);
          
          checkboxGroup.appendChild(label);
        });

        // Додаємо обробники подій для нових чекбоксів
        document.querySelectorAll('.home-uni-filter').forEach(checkbox => {
          checkbox.addEventListener('change', filterPrograms);
        });
      }

      function filterPrograms() {
        const programListContainer = document.getElementById('programListContainer');
        if (!programListContainer) return;
        
        // Get selected filters
        const selectedLevels = Array.from(document.querySelectorAll('.level-filter:checked')).map(el => el.value);
        const selectedHomeUnis = Array.from(document.querySelectorAll('.home-uni-filter:checked')).map(el => el.value);
        
        // Filter programs
        let filteredPrograms = allPrograms;
        
        // Filter by level
        if (selectedLevels.length > 0) {
          filteredPrograms = filteredPrograms.filter(program => 
            selectedLevels.includes(program.study_level)
          );
        }
        
        // Filter by home university
        if (selectedHomeUnis.length > 0) {
          filteredPrograms = filteredPrograms.filter(program => 
            selectedHomeUnis.includes(program.home_university)
          );
        }
        
        // Display results
        if (filteredPrograms.length === 0) {
          programListContainer.innerHTML = `<p class="no-programs">${translateText('No programs found matching your criteria.')}</p>`;
          return;
        }
        
        programListContainer.innerHTML = '';
        filteredPrograms.forEach(program => {
          const programCard = document.createElement('div');
          programCard.className = 'program-card';
          
          const programTitle = document.createElement('h2');
          programTitle.textContent = `${program.name} (${program.home_university} - ${program.university})`;
          
          const quoteIcon = document.createElement('img');
          quoteIcon.className = 'icon-img';
          quoteIcon.src = './project/img/quotation.svg';
          
          const programDescription = document.createElement('p');
          programDescription.textContent = program.testimonial || translateText('No testimonial available for this program.');
          
          const readMoreLink = document.createElement('a');
          readMoreLink.href = `programs-read-more.html?id=${program.id}&lang=${currentLanguage}`;
          readMoreLink.className = 'btn read-more-btn2';
          readMoreLink.textContent = translateText('Читати більше');
          
          programCard.appendChild(programTitle);
          programCard.appendChild(quoteIcon);
          programCard.appendChild(programDescription);
          programCard.appendChild(readMoreLink);
          
          programListContainer.appendChild(programCard);
        });
      }

      function setupFilters() {
        // Level filter change
        document.querySelectorAll('.level-filter').forEach(checkbox => {
          checkbox.addEventListener('change', filterPrograms);
        });
        
        // Home university search
        const homeUniSearch = document.getElementById('homeUniSearch');
        if (homeUniSearch) {
          homeUniSearch.addEventListener('input', function() {
            updateHomeUniversityFilters();
          });
        }
        
        // Home university checkboxes
        const homeUniCheckboxes = document.getElementById('homeUniCheckboxes');
        if (homeUniCheckboxes) {
          homeUniCheckboxes.addEventListener('change', function(e) {
            if (e.target.classList.contains('home-uni-filter')) {
              filterPrograms();
            }
          });
        }
      }

      document.addEventListener('DOMContentLoaded', function() {
        // Ініціалізація мови
        updatePageLanguage();

        // Додаємо обробники подій для кнопок мови
        document.querySelectorAll('.js-switch-button').forEach(button => {
          button.addEventListener('click', function() {
            switchLanguage(this.getAttribute('data-lang'));
          });
        });

        // Setup filters
        setupFilters();

        // Initial load
        loadAllPrograms();
      });
    </script>
    <style>
      .loading-spinner, .no-programs, .error-message {
        text-align: center;
        padding: 20px;
        font-size: 18px;
        color: #666;
      }
      
      .error-message {
        color: #d9534f;
      }
      
      .no-programs {
        color: #5bc0de;
      }
    </style>
  </body>
</html>
