              <li>

    <main>
      <section class="faq-section">
        <div class="container">
          <div class="faq-section__container">
            <div class="faq__heading">
              <span class="faq__text-outline" data-en="FAQ" data-ua="FAQ"

              <h2 class="faq__text-fill" data-en="FAQ" data-ua="FAQ">FAQ</h2>

            <div id="faq-container">
              <!-- FAQ items will be loaded here dynamically -->
              <div class="loading-spinner" data-en="Loading FAQs..." data-ua="Завантаження FAQ...">Завантаження FAQ...</div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <div class="footer__container">
          <div class="footer__logo">
            <img
              class="footer__img"
              src="./project/img/name_no-background_01.svg"
              alt="StudentAbroad logo" />
          </div>

          <div class="footer__bottom-row">
            <nav class="footer__nav">
              <ul class="footer__menu">
                <li>
                  <a
                    class="footer__link"
                    href="index.html"
                    data-en="ABOUT US"
                    data-ua="ПРО НАС"
                    >ПРО НАС</a
                  >
                </li>
                <li>
                  <a
                    class="footer__link"
                    href="uni-list.html"
                    data-en="UNI LIST"
                    data-ua="СПИСОК ВНЗ"
                    >СПИСОК ВНЗ</a
                  >
                </li>
                <li>
                  <a
                    class="footer__link"
                    href="program-list.html"
                    data-en="PROGRAM LIST"
                    data-ua="ПРОГРАМИ"
                    >ПРОГРАМИ</a
                  >
                </li>
                <li>
                  <a
                    class="footer__link"
                    href="faq.html"
                    data-en="FAQ"
                    data-ua="FAQ"
                    >FAQ</a
                  >
                </li>
              </ul>
            </nav>

            <div class="lang-search">
              <span class="language-switch">
                <button data-lang="ua" class="js-switch-button active" type="button">
                  UA
                </button>
                <button
                  data-lang="en"
                  class="js-switch-button"
                  type="button">
                  EN
                </button>
              </span>
              <div class="search-box">
                <input
                  type="text"
                  class="search-box__input"
                  data-en="Search..."
                  data-ua="Шукати..."
                  placeholder="Шукати..." />
              </div>
            </div>
          </div>
          <div class="footer__line"></div>
        </div>
      </div>
    </footer>

    <!-- Updated JavaScript for FAQ loading with smooth animation -->
    <script>
      let currentLanguage = 'ua'; // Українська за замовчуванням

      document.addEventListener('DOMContentLoaded', function() {
        setupLanguageSwitch();
        loadFAQs(currentLanguage);
      });

      function setupLanguageSwitch() {
        const switchButtons = document.querySelectorAll('.js-switch-button');
        
        switchButtons.forEach(button => {
          button.addEventListener('click', function() {
            const lang = this.getAttribute('data-lang');
            
            // Update active button state
            switchButtons.forEach(btn => {
              btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
            });
            
            // Change language
            changeLanguage(lang);
          });
        });
      }

      function changeLanguage(lang) {
        currentLanguage = lang;
        
        // Update all elements with data attributes
        updatePageLanguage(lang);
        
        // Reload FAQs with new language
        loadFAQs(lang);
      }
      
      function updatePageLanguage(lang) {
        // Update all elements with data-en and data-ua attributes
        document.querySelectorAll('[data-en][data-ua]').forEach(element => {
          const text = element.getAttribute(`data-${lang}`);
          if (element.tagName === 'INPUT' || element.tagName === 'TEXTAREA') {
            element.placeholder = text;
          } else {
            element.textContent = text;
          }
        });
      }
      
      function loadFAQs(lang) {
        const faqContainer = document.getElementById('faq-container');
        const loadingText = lang === 'en' ? 'Loading FAQs...' : 'Завантаження FAQ...';
        const noFAQsText = lang === 'en' ? 'No FAQs found.' : 'FAQ не знайдено.';
        const errorText = lang === 'en' ? 'Error loading FAQs. Please try again later.' : 'Помилка завантаження FAQ. Спробуйте пізніше.';
        
        faqContainer.innerHTML = `<div class="loading-spinner">${loadingText}</div>`;
        
        // Виправлений URL API згідно з вашим бекендом
        const apiUrl = 'http://127.0.0.1:8000/faq_app/api/faq/';
        
        fetch(`${apiUrl}?lang=${lang}`)
          .then(response => {
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.json();
          })
          .then(data => {
            console.log('FAQ data received:', data); // Додано лог для дебагу
            faqContainer.innerHTML = '';
            
            // Обробка різних форматів відповіді
            let faqItems = [];
            
            if (data.faq_items) {
              // Новий формат: {faq_items: [...]}
              faqItems = data.faq_items;
            } else if (Array.isArray(data)) {
              // Старий формат: [...]
              faqItems = data;
            } else if (data.status === 'error') {
              const errorMessage = lang === 'en' 
                ? `Error loading FAQs: ${data.message}`
                : `Помилка завантаження FAQ: ${data.message}`;
              faqContainer.innerHTML = `<p class="error-message">${errorMessage}</p>`;
              return;
            }
            
            if (faqItems.length > 0) {
              faqItems.forEach(faq => {
                // Обробка категорій
                let categoriesHtml = '';
                if (faq.categories && Array.isArray(faq.categories)) {
                  categoriesHtml = faq.categories.map(cat => 
                    `<p class="faq__text">${cat.name || cat.name_en || ''}</p>`
                  ).join('');
                }
                
                // Обробка відповіді
                let answerHtml = '';
                const answer = faq.answer || '';
                if (answer.includes('\n')) {
                  answerHtml = answer.split('\n')
                    .filter(p => p.trim() !== '')
                    .map(p => `<p>${p.trim()}</p>`)
                    .join('');
                } else {
                  answerHtml = `<p>${answer}</p>`;
                }
                
                // Переклади для авторів
                const authorLabel = lang === 'en' ? 'Author:' : 'Автор:';
                const editorLabel = lang === 'en' ? 'Editor and translator:' : 'Редактор та перекладач:';
                
                // Безпечне отримання даних
                const author = faq.author || 'Unknown';
                const editor = faq.editor || 'Unknown';
                const updatedAt = faq.updated_at || 'Unknown date';
                
                const faqHtml = `
                  <div class="faq__card">
                    <div class="faq__programs">
                      ${categoriesHtml}
                    </div>
                    <div class="faq__content">
                      <h2 class="faq__h2 faq__toggle-question" tabindex="0" role="button" aria-expanded="false">
                        ${faq.question || 'No question'}
                      </h2>
                      
                      <div class="faq__meta faq__meta--top active">
                        <div class="faq__meta-row">
                          <div class="faq__meta-info">
                            <p class="faq__paragraph">${authorLabel} ${author}</p>
                            <p class="faq__paragraph">${editorLabel} ${editor}</p>
                          </div>
                          <div class="faq__date">
                            <img src="./project/img/clock_img.svg" alt="Clock icon" />
                            <p class="faq__paragraph">${updatedAt}</p>
                          </div>
                        </div>
                        <div class="faq__line"></div>
                      </div>
                      
                      <div class="faq__answer">
                        ${answerHtml || '<p>No answer available</p>'}
                      </div>
                      
                      <div class="faq__meta faq__meta--bottom">
                        <div class="faq__meta-row">
                          <div class="faq__meta-info">
                            <p class="faq__paragraph">${authorLabel} ${author}</p>
                            <p class="faq__paragraph">${editorLabel} ${editor}</p>
                          </div>
                          <div class="faq__date">
                            <img src="./project/img/clock_img.svg" alt="Clock icon" />
                            <p class="faq__paragraph">${updatedAt}</p>
                          </div>
                        </div>
                        <div class="faq__line"></div>
                      </div>
                    </div>
                  </div>
                `;
                
                faqContainer.innerHTML += faqHtml;
              });
              
              // Reinitialize FAQ toggle functionality
              initFAQToggle();
            } else {
              faqContainer.innerHTML = `<p class="no-faqs-message">${noFAQsText}</p>`;
            }
          })
          .catch(error => {
            console.error('Error loading FAQs:', error);
            const detailedError = lang === 'en' 
              ? `Error: ${error.message}. Please check if the server is running.`
              : `Помилка: ${error.message}. Будь ласка, перевірте чи запущений сервер.`;
            faqContainer.innerHTML = `<p class="error-message">${detailedError}</p>`;
          });
      }
      
      function initFAQToggle() {
        // Add toggle functionality to FAQ questions
        document.querySelectorAll('.faq__toggle-question').forEach(question => {
          // Set initial state
          question.setAttribute('aria-expanded', 'false');
          
          question.addEventListener('click', function() {
            const answer = this.nextElementSibling.nextElementSibling;
            const topMeta = this.nextElementSibling;
            const bottomMeta = answer.nextElementSibling;
            const isExpanded = this.getAttribute('aria-expanded') === 'true';
            
            // Toggle states
            this.setAttribute('aria-expanded', !isExpanded);
            
            if (!isExpanded) {
              // Show answer and bottom meta, hide top meta
              answer.style.maxHeight = '0';
              answer.classList.add('active');
              answer.style.maxHeight = answer.scrollHeight + 'px';
              
              topMeta.classList.remove('active');
              bottomMeta.classList.add('active');
            } else {
              // Hide answer and bottom meta, show top meta
              answer.style.maxHeight = '0';
              answer.classList.remove('active');
              
              topMeta.classList.add('active');
              bottomMeta.classList.remove('active');
            }
          });
          
          // Add keyboard support
          question.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              this.click();
            }
          });
        });
      }
    </script>
    
    <style>
      .loading-spinner {
        text-align: center;
        padding: 2rem;
        font-style: italic;
        color: #666;
      }
      
      .error-message {
        text-align: center;
        padding: 2rem;
        color: #d9534f;
        font-style: italic;
      }
      
      .no-faqs-message {
        text-align: center;
        padding: 2rem;
        color: #666;
        font-style: italic;
      }
      
      /* Smooth animation for FAQ elements */
      .faq__meta--top {
        max-height: 100px;
        opacity: 1;
        transition: max-height 0.4s ease-out, opacity 0.4s ease-out;
      }
      
      .faq__meta--top:not(.active) {
        max-height: 0;
        opacity: 0;
        overflow: hidden;
      }
      
      .faq__meta--bottom {
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        transition: max-height 0.4s ease-out, opacity 0.4s ease-out;
      }
      
      .faq__meta--bottom.active {
        max-height: 100px;
        opacity: 1;
      }
      
      .faq__answer {
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        transition: max-height 0.4s ease-out, opacity 0.4s ease-out;
      }
      
      .faq__answer.active {
        max-height: 1000px;
        opacity: 1;
      }
      
      /* Ensure proper spacing */
      .faq__card {
        margin-bottom: 30px;
      }
      
      .faq__h2 {
        cursor: pointer;
        transition: color 0.2s ease;
      }
      
      .faq__h2:hover {
        color: #1743d7;
      }
    </style>
  </body>
</html>
